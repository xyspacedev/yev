[project]
name = "jeff"
version = "0.1.0"
description = "jeff-4b: an open System One decision model"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "huggingface_hub>=0.25",
  "numpy>=1.26",
  "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
train = ["transformers>=5.0", "peft>=0.17", "accelerate>=1.0", "tensorboard>=2.17"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
jeff = "jeff.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: needs internet access"]
